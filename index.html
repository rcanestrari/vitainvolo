	// Tratte: [da, a, numero di voli]. Il conteggio somma i due versi (andata + ritorno).

	// ---------- Mappa ----------
	const map = L.map('map', { zoomSnap: 0.1, worldCopyJump: true }).setView([0.0, 0.0], 2.1);

	L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);

	// ---------- Marker ----------
	const coords = {};
	for (const [name, lat, lon] of places) {
		coords[name] = [lat, lon];
		L.marker([lat, lon]).addTo(map).bindPopup('<b>' + name + '</b>');
	}

	// ---------- Archi (cerchio massimo) ----------
	// Restituisce una lista di segmenti: la rotta viene spezzata
	// quando attraversa l'antimeridiano (±180°) per evitare linee che
	// tagliano tutta la mappa.
	function greatCircle(a, b) {
		const rad = Math.PI / 180, deg = 180 / Math.PI;
		const lat1 = a[0] * rad, lon1 = a[1] * rad;
		const lat2 = b[0] * rad, lon2 = b[1] * rad;

		const d = 2 * Math.asin(Math.sqrt(
			Math.sin((lat2 - lat1) / 2) ** 2 +
			Math.cos(lat1) * Math.cos(lat2) * Math.sin((lon2 - lon1) / 2) ** 2
		));
		if (d < 1e-9) return [[a]];

		const steps = Math.max(2, Math.ceil(d * deg / 2)); // un punto ogni ~2°
		const pts = [];
		for (let i = 0; i <= steps; i++) {
			const f = i / steps;
			const A = Math.sin((1 - f) * d) / Math.sin(d);
			const B = Math.sin(f * d) / Math.sin(d);
			const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
			const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
			const z = A * Math.sin(lat1) + B * Math.sin(lat2);
			pts.push([Math.atan2(z, Math.sqrt(x * x + y * y)) * deg, Math.atan2(y, x) * deg]);
		}

		const segments = [[pts[0]]];
		for (let i = 1; i < pts.length; i++) {
			const prev = pts[i - 1], cur = pts[i];
			if (Math.abs(cur[1] - prev[1]) > 180) {
				const goingEast = prev[1] > 0;
				const edge = goingEast ? 180 : -180;
				const curLon = goingEast ? cur[1] + 360 : cur[1] - 360;
				const t = (edge - prev[1]) / (curLon - prev[1]);
				const lat = prev[0] + t * (cur[0] - prev[0]);
				segments[segments.length - 1].push([lat, edge]);
				segments.push([[lat, -edge]]);
			}
			segments[segments.length - 1].push(cur);
		}
		return segments;
	}

	// ---------- Colore e spessore in base alla frequenza ----------
	// Scala logaritmica: poche tratte hanno moltissimi voli, la maggior parte 1-2.
	const maxCount = Math.max(...routes.map(r => r[2]));
	const totalFlights = routes.reduce((sum, r) => sum + r[2], 0);

	// [posizione 0..1, [r, g, b]]: dal blu (poco frequente) al rosso (molto frequente)
	const stops = [
		[0.00, [59, 130, 196]],
		[0.35, [47, 181, 163]],
		[0.65, [242, 178, 26]],
		[1.00, [215, 25, 28]]
	];

	function scale(count) {
		return maxCount > 1 ? Math.log(count) / Math.log(maxCount) : 0;
	}

	function colorAt(t) {
		for (let i = 1; i < stops.length; i++) {
			if (t <= stops[i][0]) {
				const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
				const f = (t - t0) / (t1 - t0);
				return 'rgb(' + c0.map((v, k) => Math.round(v + f * (c1[k] - v))).join(',') + ')';
			}
		}
		return 'rgb(' + stops[stops.length - 1][1].join(',') + ')';
	}

	function styleFor(count) {
		const t = scale(count);
		return { color: colorAt(t), weight: 1.5 + 4.5 * t, opacity: 0.55 + 0.35 * t };
	}

	// Le tratte meno frequenti si disegnano per prime, così le più frequenti restano in primo piano.
	[...routes].sort((a, b) => a[2] - b[2]).forEach(([from, to, count]) => {
		if (!coords[from] || !coords[to]) {
			console.warn('Tratta ignorata, luogo sconosciuto:', from, to);
			return;
		}
		const base = styleFor(count);
		const line = L.polyline(greatCircle(coords[from], coords[to]), base).addTo(map);
		line.bindTooltip(from + ' ⇄ ' + to + ' · ' + count + (count === 1 ? ' volo' : ' voli'), { sticky: true });
		line.on('mouseover', () => line.setStyle({ weight: base.weight + 2, opacity: 1 }));
		line.on('mouseout', () => line.setStyle(base));
	});

	// ---------- Legenda ----------
	const legend = L.control({ position: 'bottomleft' });
	legend.onAdd = function () {
		const div = L.DomUtil.create('div', 'legend');
		const gradient = stops.map(([t, c]) => 'rgb(' + c.join(',') + ') ' + (t * 100) + '%').join(', ');
		const ticks = [...new Set([1, 2, 5, 10, 20, maxCount].filter(v => v <= maxCount))];
		div.innerHTML =
			'<b>Voli per tratta</b>' +
			'<div class="scale">' +
				'<div class="bar" style="background:linear-gradient(to right, ' + gradient + ')"></div>' +
				'<div class="ticks">' +
					ticks.map(v => '<span style="left:' + (scale(v) * 100) + '%">' + v + '</span>').join('') +
				'</div>' +
			'</div>' +
			'<div class="total">' + routes.length + ' tratte · ' + totalFlights + ' voli</div>';
		L.DomEvent.disableClickPropagation(div);
		return div;
	};
	legend.addTo(map);

	// ---------- Click sulla mappa ----------
	const popup = L.popup();

	function onMapClick(e) {
		popup
			.setLatLng(e.latlng)
			.setContent(`You clicked the map at ${e.latlng.toString()}`)
			.openOn(map);
	}

	map.on('click', onMapClick);
